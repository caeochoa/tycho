name: "Awesome CV"
description: "Clean typographic layout with accent-colored headers, dates-left two-column entries"
ats_friendly: true
languages: [en, es]

params:
  accent_color:
    type: color
    default: "#0e76a8"
    label: "Header and rule color"
  font:
    type: choice
    options: [lmodern, raleway, sourcesanspro]
    default: lmodern
  show_photo:
    type: bool
    default: false
    label: "Include circular profile photo (requires photo_path in personal.yaml)"
