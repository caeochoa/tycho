search:
  terms: [
    "AI Engineer", "Machine Learning Engineer", "Python Developer",
    "Applied AI Engineer", "AI Platform Engineer",
    "ML Platform Engineer", "Staff ML Engineer",
    "LLM Engineer", "Generative AI Engineer",
    "Forward Deployed Engineer", "AI Deployment Engineer", "Solutions Engineer, AI"
  ]
  locations: ["Remote", "Madrid", "London", "Edinburgh", "Barcelona", "Galway"]
  country: "Ireland"                 # default country_indeed; also selects CV phone number
  location_countries:              # per-location country_indeed overrides for Indeed
    Galway: "Ireland"
    London: "UK"
    Edinburgh: "UK"
    Madrid: "Spain"
    Barcelona: "Spain"
  linkedin_fetch_description: true # fetch each LinkedIn job page for full description (slower)
  results_per_source: 100
  max_age_days: 3                  # daily run; backfill with `tycho collect --max-age-days 30` (0/null disables)

# Company careers pages to monitor directly (ATS job boards).
# Provider (greenhouse, lever, ashby, workable, smartrecruiters, recruitee,
# personio) and board slug are auto-detected from the URL; add `provider:` and
# `board:` keys to override. Every posting is collected and scored.
# companies:
#   - name: Acme
#     url: https://boards.greenhouse.io/acme
#   - name: Globex
#     url: https://jobs.lever.co/globex

scoring:
  weights:
    keyword_match: 0.30
    title_match: 0.20
    skills_overlap: 0.35
    location_match: 0.15
  min_keywords_confidence: 6
  thresholds:
    high_interest: 0.75
    low_interest: 0.25
  recency:                # old postings decay so stale jobs sink in the ranking
    enabled: true
    full_score_days: 14   # no penalty up to this age
    decay_days: 90        # linear decay ends here
    min_factor: 0.4       # score multiplier floor for old jobs
  locations:
    preferred:
      - madrid
      - london
      - edinburgh
      - barcelona
      - spain
      - uk
      - galway
      - ireland
    preferred_es:
      - españa
      - reino unido
      - edimburgo
      - londres
      - barcelona
    remote_keywords:
      - remote
      - remoto
    abbreviations:
      md: madrid
      es: spain
      gb: united kingdom

llm:
  provider: "anthropic"
  model: "claude-sonnet-4-5-20250929"
  temperature: 0.3
  enabled: true

cover_letter:
  max_paragraphs: 3
  tone: "professional"

output:
  formats: ["pdf", "docx"]
  language: "en"
  template: "developer_cv"

profile_dir: "profile"
db_path: "tycho.db"
output_dir: "output"

telegram:
  enabled: false
  token: ""
  allowed_users:
    - 4042272
  page_size: 5

scheduler:
  enabled: true
  cron: "0 8 * * *"